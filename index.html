<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pokémon Game — Charizard</title>
    <!-- Icono vacío: evita el 404 de /favicon.ico en la consola -->
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      /* El canvas tiene la resolución del fondo; CSS ajusta #stage a la ventana sin deformarlo. */
      #stage {
        position: relative;
        width: min(100vw, calc(100vh * 2752 / 1536));
      }
      #game {
        display: block;
        width: 100%;
        height: auto;
      }
      /* HUD en px fijos: no se escala con el canvas y sigue legible en ventanas pequeñas.
         max-width: en ventanas estrechas los dos HUD se acortan en vez de tocarse. */
      .hud {
        position: absolute;
        top: 12px;
        box-sizing: border-box;
        max-width: calc(50% - 18px);
        padding: 8px 10px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font: 16px/1.25 sans-serif;
        pointer-events: none;
      }
      #hud {
        left: 12px;
      }
      #hud-rival {
        right: 12px;
      }
      .hud-bar {
        width: 200px;
        max-width: calc(100% - 4px); /* = min(200px, 100%) contando el borde, sin depender del texto */
        height: 16px;
        margin: 4px 0;
        border: 2px solid #fff;
        border-radius: 4px;
        background: #333;
        overflow: hidden;
      }
      .hud-fill {
        height: 100%;
      }
      #hud-controls {
        font-size: 13px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="hud" class="hud" hidden>
        <div id="hud-name"></div>
        <div class="hud-bar"><div id="hud-fill" class="hud-fill"></div></div>
        <div id="hud-text"></div>
        <div id="hud-controls">H: placaje de prueba · R: restaurar</div>
      </div>
      <div id="hud-rival" class="hud" hidden>
        <div id="hud-rival-name"></div>
        <div class="hud-bar"><div id="hud-rival-fill" class="hud-fill"></div></div>
        <div id="hud-rival-text"></div>
      </div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
